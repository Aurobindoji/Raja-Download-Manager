[package]
name = "raja-core"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
eframe = "0.37.0"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.11.1"
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17.2", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }

[workspace]
members = ["."]
resolver = "3"
